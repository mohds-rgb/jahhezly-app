services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: jahhezly
      POSTGRES_USER: jahhezly
      POSTGRES_PASSWORD: jahhezly-local-only
    ports:
      - "5432:5432"
    volumes:
      - jahhezly_pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      JAHHEZLY_ENV: development
      JAHHEZLY_DB_URL: postgresql+psycopg://jahhezly:jahhezly-local-only@postgres:5432/jahhezly
      JAHHEZLY_JWT_SECRET: local-compose-secret-only
      JAHHEZLY_ALLOW_GUEST_ORDERS: "true"
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  jahhezly_pgdata:

FROM python:3.11-slim

WORKDIR /app

ENV PYTHONDONTWRITEBYTECODE=1
ENV PYTHONUNBUFFERED=1

COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt

COPY . .

CMD ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"]
