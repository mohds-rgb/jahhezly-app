[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jahhezly-api"
version = "0.2.0"
description = "Jahhezly Click & Collect modular monolith API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "sqlalchemy==2.0.50",
  "alembic==1.18.4",
  "pydantic==2.13.4",
  "PyJWT==2.13.0",
  "psycopg[binary]==3.3.6"
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "httpx==0.28.1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.fastapi]
entrypoint = "app.main:app"
